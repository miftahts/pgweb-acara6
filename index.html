<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet JS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css">

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        #map {
            width: 100%;
            height: calc(100vh - 56px);
            margin: 0;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">

            <a class="navbar-brand" href="#">Navbar</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="https://sv.ugm.ac.id/">
                            <i class="bi bi-link-45deg"></i> SV UGM
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#aboutModal">

                            <i class="bi bi-info-circle"></i> About

                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <!-- Modal About -->

    <div class="modal fade" id="aboutModal" tabindex="-1" aria-labelledby="aboutModalLabel" aria-hidden="true">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h1 class="modal-title fs-5" id="aboutModalLabel">
                        About
                    </h1>

                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>

                </div>

                <div class="modal-body">

                    <table class="table table-striped table-bordered">

                        <tr>
                            <th>Nama</th>
                            <td>Anjeli Rista Devi</td>
                        </tr>

                        <tr>
                            <th>NIM</th>
                            <td>25/564877/SV/26879</td>
                        </tr>

                        <tr>
                            <th>Kelas</th>
                            <td>A</td>
                        </tr>

                    </table>

                </div>

                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Close
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- Modal Feature / Jumlah Penduduk -->
    <div class="modal fade" id="featureModal" tabindex="-1" aria-labelledby="featureModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="featureModalTitle"></h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="featureModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>


    <div id="map"></div>


    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="">
        </script>

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js"></script>


    <script>

        // Inisialisasi peta

        var map = L.map("map").setView(
            [-8.3365180, 122.9493713],
            11
        );


        // Pane khusus

        map.createPane("paneJalan");
        map.getPane("paneJalan").style.zIndex = 400;

        map.createPane("paneJumlahPenduduk");
        map.getPane("paneJumlahPenduduk").style.zIndex = 300;


        // Tile Layer Base Map

        var basemap = L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            }
        );


        basemap.addTo(map);


        // GeoJSON Point Toponimi

        var toponimi = L.geoJSON(null, {

            pointToLayer: function (feature, latlng) {

                var unsur = String(feature.properties.NAMA_UNSUR).toLowerCase();
                var iconName = "tag";
                var markerColor = "orange";

                if (unsur.includes("gunung")) {
                    iconName = "mountain";
                    markerColor = "red";
                } else if (unsur.includes("teluk")) {
                    iconName = "water";
                    markerColor = "blue";
                } else if (unsur.includes("tanjung")) {
                    iconName = "anchor";
                    markerColor = "green";
                }

                var awesomeIcon = L.AwesomeMarkers.icon({
                    icon: iconName,
                    prefix: "fa",
                    markerColor: markerColor,
                    iconColor: "white"
                });

                return L.marker(latlng, {
                    icon: awesomeIcon
                });

            },


            onEachFeature: function (feature, layer) {

                var popup_content =
                    "Nama: " +
                    feature.properties.TOPONIMI +
                    "<br>" +

                    "Koordinat: " +
                    feature.geometry.coordinates[1] +
                    ", " +
                    feature.geometry.coordinates[0] +
                    "<br>" +

                    "<img src='images/" +
                    feature.properties.image +
                    "' alt='' width='200'/>";


                layer.bindPopup(popup_content);


                layer.bindTooltip(
                    String(feature.properties.TOPONIMI),
                    {
                        direction: "left",
                        sticky: true
                    }
                );

            }

        });


        $.getJSON(
            "GeoJSON/toponimi.geojson",
            function (data) {

                toponimi.addData(data);

                map.addLayer(toponimi);

            }
        );


        // GeoJSON Polyline Jalan

        var jalan = L.geoJSON(null, {

            pane: "paneJalan",

            style: function (feature) {

                var unsur = String(feature.properties.NAMA_UNSUR).toLowerCase();

                if (unsur.includes("propinsi") || unsur.includes("provinsi")) {
                    return {
                        color: "red",
                        weight: 3,
                        opacity: 1
                    };
                }

                if (unsur.includes("kabupaten")) {
                    return {
                        color: "red",
                        weight: 1.5,
                        dashArray: "10, 5",
                        opacity: 1
                    };
                }

                return {
                    color: "red",
                    weight: 0.5,
                    dashArray: "3, 3",
                    opacity: 1
                };

            },


            onEachFeature: function (feature, layer) {

                var popup_content =
                    "Fungsi: " +
                    feature.properties.NAMA_UNSUR +
                    "<br>" +

                    "Panjang (Km): " +
                    feature.properties.panjang_km;


                layer.bindPopup(popup_content);


                layer.bindTooltip(
                    String(feature.properties.NAMA_UNSUR),
                    {
                        direction: "auto",
                        sticky: true
                    }
                );

            }

        });


        $.getJSON(
            "GeoJSON/jalan.geojson",
            function (data) {

                jalan.addData(data);

                map.addLayer(jalan);

            }
        );


        // GeoJSON Polygon Jumlah Penduduk

        var jumlah_penduduk = L.geoJSON(null, {

            pane: "paneJumlahPenduduk",

            style: function (feature) {

                var p = feature.properties.Penduduk;

                var warna =
                    p <= 12000
                        ? "#ffffb2"
                        : (p <= 24000
                            ? "#fd8d3c"
                            : "#bd0026");


                return {

                    opacity: 1,

                    color: "black",

                    weight: 1.0,

                    fillOpacity: 0.7,

                    fillColor: warna

                };

            },


            onEachFeature: function (feature, layer) {

                layer.on({
                    click: function (e) {
                        $("#featureModalTitle").html("Kecamatan " + feature.properties.WADMKC);
                        $("#featureModalBody").html(
                            "<table class='table table-striped table-bordered'>" +
                            "<tr><th>Kecamatan</th><td>" + feature.properties.WADMKC + "</td></tr>" +
                            "<tr><th>Jumlah Penduduk</th><td>" + feature.properties.Penduduk + " Jiwa</td></tr>" +
                            "</table>"
                        );
                        bootstrap.Modal.getOrCreateInstance(document.getElementById("featureModal")).show();
                    }
                });

                layer.bindTooltip(
                    String(feature.properties.WADMKC),
                    {
                        direction: "auto",
                        sticky: true
                    }
                );

            }

        });


        $.getJSON(
            "GeoJSON/jumlah_penduduk.geojson",
            function (data) {

                jumlah_penduduk.addData(data);

                map.addLayer(jumlah_penduduk);

            }
        );


        // Control Layer

        var baseMaps = {

            "OpenStreetMap": basemap

        };


        var labelJalan =
            "Jalan<br>" +

            "<div style='margin-left: 20px; font-size: 12px; line-height: 1.6;'>" +

            "<span style='display: inline-block; width: 18px; height: 3px; background-color: red; vertical-align: middle; margin-right: 6px;'></span> Jalan Propinsi<br>" +

            "<span style='display: inline-block; width: 18px; height: 0; border-top: 2px dashed red; vertical-align: middle; margin-right: 6px;'></span> Jalan Kabupaten<br>" +

            "<span style='display: inline-block; width: 18px; height: 0; border-top: 1px dotted red; vertical-align: middle; margin-right: 6px;'></span> Jalan Lain" +

            "</div>";


        var labelPenduduk =
            "Jumlah Penduduk<br>" +

            "<div style='margin-left: 20px; font-size: 12px; line-height: 1.6;'>" +

            "<span style='display: inline-block; width: 14px; height: 14px; background-color: #ffffb2; border: 1px solid #333; vertical-align: middle; margin-right: 6px;'></span> &le; 12.000<br>" +

            "<span style='display: inline-block; width: 14px; height: 14px; background-color: #fd8d3c; border: 1px solid #333; vertical-align: middle; margin-right: 6px;'></span> 12.001 - 24.000<br>" +

            "<span style='display: inline-block; width: 14px; height: 14px; background-color: #bd0026; border: 1px solid #333; vertical-align: middle; margin-right: 6px;'></span> &gt; 24.000" +

            "</div>";


        var labelToponimi =
            "Toponimi<br>" +

            "<div style='margin-left: 20px; font-size: 12px; line-height: 1.6;'>" +

            "<i class='fa-solid fa-mountain' style='color: red; margin-right: 6px;'></i> Gunung<br>" +

            "<i class='fa-solid fa-water' style='color: blue; margin-right: 6px;'></i> Teluk<br>" +

            "<i class='fa-solid fa-anchor' style='color: green; margin-right: 6px;'></i> Tanjung<br>" +

            "<i class='fa-solid fa-tag' style='color: orange; margin-right: 6px;'></i> Lainnya" +

            "</div>";


        var overlayMaps = {

            [labelToponimi]:
                toponimi,

            [labelJalan]:
                jalan,

            [labelPenduduk]:
                jumlah_penduduk

        };


        var controllayer = L.control.layers(
            baseMaps,
            overlayMaps,
            {
                collapsed: false
            }
        );


        controllayer.addTo(map);


        // Scale Bar

        L.control.scale({

            position: "bottomleft",

            metric: true,

            imperial: false

        }).addTo(map);

    </script>

</body>

</html>
